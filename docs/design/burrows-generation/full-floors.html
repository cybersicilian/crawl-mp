<div id="dcss-native-full-floors">
  <style>
    #dcss-native-full-floors .nf-fields {display:grid;grid-template-columns:1fr 1fr;gap:12px}
    #dcss-native-full-floors .nf-fields label {min-width:0}
    #dcss-native-full-floors .nf-controls {display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
    #dcss-native-full-floors .nf-summary {flex:1;min-width:180px}
    #dcss-native-full-floors canvas {display:block;width:100%;aspect-ratio:4/3;touch-action:none}
    #dcss-native-full-floors .nf-detail {margin:8px 0;overflow-wrap:anywhere}
    #dcss-native-full-floors .nf-legend {display:flex;align-items:center;gap:8px}
    #dcss-native-full-floors .nf-key {width:20px;height:2px;background:var(--viz-series-1)}
    @media(max-width:520px) {#dcss-native-full-floors .nf-fields {grid-template-columns:1fr}}
  </style>
  <div class="nf-fields">
    <label class="form-label">Full floor
      <select class="form-select" data-floor aria-label="Choose a full native floor"></select>
    </label>
    <label class="form-label">Creature or loot
      <select class="form-select" data-inspect aria-label="Inspect a creature or item"></select>
    </label>
  </div>
  <div class="nf-controls">
    <span class="nf-summary text-small" data-summary></span>
    <button class="btn" type="button" data-minus aria-label="Zoom out">−</button>
    <button class="btn" type="button" data-fit>Full floor</button>
    <button class="btn" type="button" data-plus aria-label="Zoom in">+</button>
  </div>
  <canvas role="img" aria-label="Generated native floor: drag to pan, zoom, or select a tile">Generated native floor.</canvas>
  <div class="nf-detail" data-detail aria-live="polite">Select a creature, item, or map tile.</div>
  <div class="nf-legend text-small"><span class="nf-key" aria-hidden="true"></span>Authored vault boundary · Fully revealed</div>
  <script type="application/json" data-native-floors><!--NATIVE_FLOORS_DATA--></script>
  <script>
  (() => {
    const root = document.getElementById('dcss-native-full-floors');
    const data = JSON.parse(root.querySelector('[data-native-floors]').textContent);
    const floorSelect = root.querySelector('[data-floor]');
    const inspectSelect = root.querySelector('[data-inspect]');
    const summary = root.querySelector('[data-summary]');
    const detail = root.querySelector('[data-detail]');
    const canvas = root.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const atlas = new Image();
    const picture = document.createElement('canvas');
    const pictureCtx = picture.getContext('2d');
    const branches = {Bur:'Burrows',Worm:'Wormlands',Hive:'Hive'};
    const views = new Map();
    let floor, view, selected = null, drag = null, size = {w:1,h:1};
    function bytes(text) {return Uint8Array.from(atob(text), char => char.charCodeAt(0));}
    for (const level of data.levels) {
      const raw = bytes(level.tiles);
      const buffer = new DataView(raw.buffer);
      level.tileIds = Array.from({length:raw.length/2},(_,i) => buffer.getUint16(i*2,true));
      level.featureIds = bytes(level.features);
      level.vaultIds = bytes(level.vaults);
    }
    for (const [key,name] of Object.entries(branches)) {
      const group = document.createElement('optgroup');
      group.label = name;
      for (const level of data.levels.filter(level => level.branch===key)) {
        const option = new Option(`${name}:${level.title.split(':')[1]} · ${level.seed}`,level.id);
        group.append(option);
      }
      floorSelect.append(group);
    }
    function minimum() {return Math.min(size.w/floor.w,size.h/floor.h)*0.96;}
    function save() {
      window.openai?.setWidgetState({modelContent:{floor:floor.id,seed:floor.seed,
        selected:selected===null ? null : tileInfo(selected)},
        privateContent:{view:{...view},floor:floor.id,selected}}).catch(() => {});
    }
    function tileInfo(index) {
      const vault = floor.vaultIds[index];
      return {x:floor.x+index%floor.w,y:floor.y+Math.floor(index/floor.w),
        terrain:floor.featureNames[floor.featureIds[index]],
        occupants:floor.occupants[index] || [],vault:vault ? floor.vaultNames[vault-1] : ''};
    }
    function showSelection(index) {
      selected = index;
      const info = tileInfo(index);
      detail.textContent = `${info.x},${info.y} · ${info.occupants.join(' / ') || info.terrain.replaceAll('_',' ')}${info.vault ? ' · '+info.vault : ''}`;
      inspectSelect.value=String(index);
    }
    function inspect(index, focus=false) {
      showSelection(index);
      if (focus) {
        view = {s:Math.max(20,view.s),cx:index%floor.w+0.5,cy:Math.floor(index/floor.w)+0.5,fit:false};
      }
      draw(); save();
    }
    function fit() {view = {s:minimum(),cx:floor.w/2,cy:floor.h/2,fit:true};draw();}
    function draw() {
      if (!floor || !atlas.naturalWidth) return;
      const ratio = Math.min(window.devicePixelRatio || 1,2);
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.clearRect(0,0,size.w,size.h);
      ctx.imageSmoothingEnabled = false;
      const ox = size.w/2-view.cx*view.s, oy = size.h/2-view.cy*view.s;
      ctx.drawImage(picture,ox,oy,floor.w*view.s,floor.h*view.s);
      ctx.strokeStyle = getComputedStyle(root.querySelector('.nf-key')).backgroundColor;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1;
      ctx.beginPath();
      floor.vaultIds.forEach((id,index) => {
        if (!id) return;
        const x=index%floor.w,y=Math.floor(index/floor.w),s=view.s;
        const edge=(a,b,c,d) => {ctx.moveTo(ox+a*s,oy+b*s);ctx.lineTo(ox+c*s,oy+d*s);};
        if (x===0 || floor.vaultIds[index-1]!==id) edge(x,y,x,y+1);
        if (y===0 || floor.vaultIds[index-floor.w]!==id) edge(x,y,x+1,y);
        if (x===floor.w-1 || floor.vaultIds[index+1]!==id) edge(x+1,y,x+1,y+1);
        if (y===floor.h-1 || floor.vaultIds[index+floor.w]!==id) edge(x,y+1,x+1,y+1);
      });
      ctx.stroke(); ctx.globalAlpha=1;
      if (selected!==null) {
        ctx.strokeStyle=getComputedStyle(detail).color;
        ctx.lineWidth=2;
        ctx.strokeRect(ox+selected%floor.w*view.s,oy+Math.floor(selected/floor.w)*view.s,view.s,view.s);
      }
    }
    function selectFloor(id, restored=null, restoredSelection=null) {
      if (floor && view) views.set(floor.id,{...view});
      floor=data.levels.find(level => level.id===id) || data.levels.find(level => level.id==='worm-2');
      floorSelect.value=floor.id;
      selected=null;
      picture.width=floor.w*32; picture.height=floor.h*32;
      floor.tileIds.forEach((id,index) => pictureCtx.drawImage(atlas,
        id%32*32,Math.floor(id/32)*32,32,32,index%floor.w*32,Math.floor(index/floor.w)*32,32,32));
      summary.textContent=`${floor.monsters} monsters · ${floor.items} item stacks · ${floor.fungi} mushrooms`;
      canvas.setAttribute('aria-label',`${branches[floor.branch]} ${floor.title}, seed ${floor.seed}. ${summary.textContent}.`);
      inspectSelect.replaceChildren(new Option('Select a creature or item',''));
      for (const [index,names] of Object.entries(floor.occupants)) {
        const info=tileInfo(Number(index));
        inspectSelect.append(new Option(`${info.x},${info.y} · ${names.join(' / ')}`,index));
      }
      detail.textContent='Select a creature, item, or map tile.';
      if (Number.isInteger(restoredSelection) && restoredSelection>=0 && restoredSelection<floor.w*floor.h) {
        showSelection(restoredSelection);
      }
      view=restored || views.get(floor.id);
      if (!view || view.fit) fit(); else draw();
    }
    function zoom(factor,x=size.w/2,y=size.h/2) {
      const beforeX=view.cx+(x-size.w/2)/view.s,beforeY=view.cy+(y-size.h/2)/view.s;
      const next=Math.max(minimum(),Math.min(64,view.s*factor));
      view={s:next,cx:beforeX-(x-size.w/2)/next,cy:beforeY-(y-size.h/2)/next,fit:false};
      draw(); save();
    }
    function position(event) {
      const rect=canvas.getBoundingClientRect();
      return {x:event.clientX-rect.left,y:event.clientY-rect.top};
    }
    floorSelect.addEventListener('change',() => {selectFloor(floorSelect.value);save();});
    inspectSelect.addEventListener('change',() => {
      if (inspectSelect.value!=='') inspect(Number(inspectSelect.value),true);
    });
    root.querySelector('[data-minus]').addEventListener('click',() => zoom(0.7));
    root.querySelector('[data-plus]').addEventListener('click',() => zoom(1.4));
    root.querySelector('[data-fit]').addEventListener('click',() => {fit();save();});
    canvas.addEventListener('wheel',event => {
      event.preventDefault();const p=position(event);zoom(Math.exp(-event.deltaY*0.002),p.x,p.y);
    },{passive:false});
    canvas.addEventListener('pointerdown',event => {
      const p=position(event);drag={...p,cx:view.cx,cy:view.cy};canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove',event => {
      if (!drag) return;
      const p=position(event);
      view={...view,cx:drag.cx-(p.x-drag.x)/view.s,cy:drag.cy-(p.y-drag.y)/view.s,fit:false};draw();
    });
    canvas.addEventListener('pointerup',event => {
      if (!drag) return;
      const p=position(event),distance=Math.hypot(p.x-drag.x,p.y-drag.y);drag=null;
      if (distance<5) {
        const x=Math.floor(view.cx+(p.x-size.w/2)/view.s),y=Math.floor(view.cy+(p.y-size.h/2)/view.s);
        if (x>=0 && y>=0 && x<floor.w && y<floor.h) inspect(y*floor.w+x);
      } else save();
    });
    canvas.addEventListener('pointercancel',() => {drag=null;});
    new ResizeObserver(() => {
      const rect=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio || 1,2);
      size={w:rect.width,h:rect.height};canvas.width=Math.round(size.w*ratio);canvas.height=Math.round(size.h*ratio);
      if (floor) {if (view.fit) fit();else draw();}
    }).observe(canvas);
    window.addEventListener('openai:set_globals',event => {
      const state=event.detail?.globals?.widgetState;
      if (state?.modelContent?.floor && atlas.naturalWidth) {
        selectFloor(state.modelContent.floor,state.privateContent?.view,state.privateContent?.selected);
      }
    });
    atlas.onload=() => {
      const state=window.openai?.widgetState;
      selectFloor(state?.modelContent?.floor || 'worm-2',state?.privateContent?.view,state?.privateContent?.selected);
    };
    atlas.src='data:image/png;base64,'+data.atlas;
  })();
  </script>
</div>
