<script>
  require.config({
    paths: { "game-{{ version }}": "/gamedata/{{ version }}" },
  });
  require(["jquery", "client"], function ($, client) {
    client.inhibit_messages();
    window.game_loading = true;
    require(["game-{{ version }}/game"], function (game) {
      $(document).trigger("game_preinit");
      $(document).trigger("game_init");
      client.uninhibit_messages();
    });
  });
</script>
<link
  rel="stylesheet"
  type="text/css"
  href="/gamedata/{{ version }}/style.css"
/>
<link
  rel="stylesheet"
  type="text/css"
  href="/gamedata/{{ version }}/simplebar.css"
/>

<link rel="stylesheet" href="/gamedata/{{ version }}/styles/assimilation.css" />

<div id="crt" style="display: none"></div>

<div id="normal" style="display: none" data-loading-readiness="dungeon">
  <div id="left_column" style="position: relative">
    <div id="party_turn_banner" style="display: none">
      <span id="party_banner_dot" class="party-banner-dot" style="display: none"></span>
      <span class="party-banner-label">Controlling</span>
      <span
        id="party_banner_who"
        data-tip-title="Active Party Hero"
        data-tip-badge="[Turn]"
        data-tip-body="The hero currently taking actions on this client view."
        data-tip-meta="Click a hero card or [Next] to switch active hero"
      >[P1] Host</span>
      <span
        id="party_banner_mode"
        class="party-badge explore"
        data-tip-title="Party Tactical Mode"
        data-tip-badge="[Mode]"
        data-tip-body="Free Explore lets party members act independently. Tactical Combat engages strict round-robin turn order when hostile monsters are in sight."
        data-tip-meta="Automatically switches when enemies are spotted"
      >Free Explore</span>
      <button
        id="party_banner_cycle"
        class="party-banner-btn"
        type="button"
        data-tip-title="Cycle Active Hero"
        data-tip-key="Next button"
        data-tip-body="Switch control and camera focus to the next living party member."
        data-tip-meta="Useful for coordinating multi-hero positioning"
      >Next hero</button>
      <button
        id="party_banner_center"
        class="party-banner-btn"
        type="button"
        data-tip-title="Center Camera"
        data-tip-badge="[View]"
        data-tip-body="Snap the dungeon viewport back to the currently active hero."
        data-tip-meta="Click any party card's [Cam] button to peek at allies"
      >Center camera</button>
    </div>
    <div id="dungeon_viewport"><canvas id="dungeon"></canvas></div>
    <div id="mobile_input" style="display: none">
      <input
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        type="text"
        placeholder="Tap here for keyboard input"
      />
    </div>
    <canvas
      id="action-panel"
      class="action-panel hidden"
      style="display: none"
      aria-label="Quick item actions; the same actions are available through Inventory"
    ></canvas>
    <div id="dcss_quick_dock" role="toolbar" aria-label="Quick Tactical Actions">
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="o"
        data-tip-title="Auto-Explore (o)"
        data-tip-key="Key: o"
        data-tip-body="Automatically travel toward unexplored dungeon tiles and items."
        data-tip-meta="Stops immediately when monsters or hazards are spotted"
      >[<span class="dock-key">o</span> Explore]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="&#9;"
        data-tip-title="Auto-Fight (Tab)"
        data-tip-key="Key: Tab"
        data-tip-body="Attack the nearest visible hostile monster with your primary weapon."
        data-tip-meta="Moves toward or strikes the closest threat"
      >[<span class="dock-key">Tab</span> Fight]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="5"
        data-tip-title="Rest &amp; Heal (5)"
        data-tip-key="Key: 5"
        data-tip-body="Wait up to 100 turns to regenerate Health (HP) and Magic (MP) until full or interrupted."
        data-tip-meta="Press '.' or 's' to wait a single turn"
      >[<span class="dock-key">5</span> Rest]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="g"
        data-tip-title="Pick Up Items (g)"
        data-tip-key="Key: g"
        data-tip-body="Pick up items on your current dungeon tile."
        data-tip-meta="Also triggered with ','"
      >[<span class="dock-key">g</span> Pickup]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="i"
        data-tip-title="Inventory (i)"
        data-tip-key="Key: i"
        data-tip-body="Open your character's inventory to equip, quaff, read, or drop items."
        data-tip-meta="Shortcuts: 'w' wield, 'q' quaff, 'r' read, 'd' drop"
      >[<span class="dock-key">i</span> Inv]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="z"
        data-tip-title="Cast Spell (z)"
        data-tip-key="Key: z"
        data-tip-body="Cast a memorised spell from your spellbook."
        data-tip-meta="Press 'M' to memorise spells"
      >[<span class="dock-key">z</span> Cast]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="a"
        data-tip-title="Use Ability (a)"
        data-tip-key="Key: a"
        data-tip-body="Invoke a divine god power, innate species ability, or evoker."
        data-tip-meta="Uses piety, MP, or ability cooldowns"
      >[<span class="dock-key">a</span> Ability]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="m"
        data-tip-title="Skills Menu (m)"
        data-tip-key="Key: m"
        data-tip-body="View skill levels, species aptitudes, and toggle skill training targets."
        data-tip-meta="Focus XP into your core combat &amp; magic skills"
      >[<span class="dock-key">m</span> Skills]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="A"
        data-tip-title="Mutations &amp; Traits (A)"
        data-tip-key="Key: A"
        data-tip-body="View your innate species traits, resistances, and acquired mutations."
        data-tip-meta="Includes species growth perks &amp; status mutations"
      >[<span class="dock-key">A</span> Traits]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="%"
        data-tip-title="Overview &amp; Resists (%)"
        data-tip-key="Key: %"
        data-tip-body="Inspect your resistances, equipment summary, and character overview."
        data-tip-meta="Displays rF, rC, rPois, rElec, rN, Willpower &amp; Slay"
      >[<span class="dock-key">%</span> Resists]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="&lt;"
        data-tip-title="Ascend Stairs (&lt;)"
        data-tip-key="Key: &lt;"
        data-tip-body="Climb up a staircase or exit portal on your tile."
        data-tip-meta="Tip: 'X' then '&lt;' travels to nearest upstairs"
      >[<span class="dock-key">&lt;</span> Up]</button>
      <button
        type="button"
        class="dcss-dock-btn"
        data-dock-key="&gt;"
        data-tip-title="Descend Stairs (&gt;)"
        data-tip-key="Key: &gt;"
        data-tip-body="Descend down a staircase or enter a branch portal (requires party nearby for branches)."
        data-tip-meta="Tip: 'X' then '&gt;' travels to nearest downstairs"
      >[<span class="dock-key">&gt;</span> Down]</button>
      <button
        type="button"
        id="dock_party_sheet_btn"
        class="dcss-dock-btn dock-btn-accent"
        data-dock-cmd="party_sheet"
        data-tip-title="Party Hero Inspector (I)"
        data-tip-key="Key: I"
        data-tip-body="Inspect any party member's full stat sheet, buffs, abilities, spells, mutations, skills, and inventory."
        data-tip-meta="Switch tabs between party heroes at any time"
      >[<span class="dock-key">I</span> Party Sheet]</button>
    </div>
    <div id="message_pane">
      <div id="messages_container">
        <div id="messages"></div>
      </div>
      <div id="more" style="display: none">--more--</div>
    </div>
  </div>
  <div id="right_column">
    {% include "character-sheet.html" %}

    {% include "party-roster.html" %}
    <details id="hud_minimap" class="hud-disclosure">
      <summary>Level overview</summary>
    <div
      id="minimap_block"
      data-tip-title="Dungeon Minimap"
      data-tip-badge="[Map]"
      data-tip-body="Real-time overview of explored terrain, staircases, shops, altars, monsters, and party positions."
      data-tip-meta="Left-click explored terrain to travel there. Right-drag to preview terrain. Normal travel warnings and interruptions apply."
    >
      <canvas id="minimap"></canvas>
      <canvas id="minimap_overlay" aria-label="Dungeon minimap: left-click to travel, right-drag to preview"></canvas>
    </div>
    </details>
    <div id="monster_list"></div>
  </div>
  <div id="tooltip" style="display: none"></div>
  <div id="dcss_rich_tooltip" style="display: none" aria-hidden="true"></div>
</div>

{% include "popup-templates.html" %}

<div id="action-panel-tooltip" style="display: none"></div>
<div id="action-panel-settings" style="display: none">
  <fieldset>
    <legend>Orientation:</legend>
    <div>
      <input
        type="radio"
        class="text"
        id="action-orient-horizontal"
        name="action_panel_orientation"
        value="horizontal"
      />
      <label for="action-orient-horizontal">horizontal</label>
    </div>
    <div>
      <input
        type="radio"
        class="text"
        id="action-orient-vertical"
        name="action_panel_orientation"
        value="vertical"
      />
      <label for="action-orient-vertical">vertical</label>
    </div>
  </fieldset>
  <fieldset id="scale-set" class="option">
    <legend>Scale, %:</legend>
    <input
      type="number"
      class="text"
      id="scale-val"
      min="50"
      max="500"
      name="action_panel_scale"
      required
    />
    <button class="reset" type="button" tabindex="-1">reset</button>
  </fieldset>
  <fieldset id="font-size-set" class="option">
    <legend>Font size, px:</legend>
    <input
      type="number"
      class="text"
      id="font-size-val"
      min="1"
      max="40"
      name="action_panel_font_size"
      required
    />
    <button class="reset" type="button" tabindex="-1">reset</button>
  </fieldset>
  <div class="settings-buttons">
    <button id="minimize-panel" type="button" tabindex="-1">Minimize</button>
    <button id="close-settings" type="button" tabindex="-1">Close</button>
  </div>
</div>
<div
  id="action-panel-placeholder"
  class="action-panel hidden"
  style="display: none"
  aria-label="Show quick item actions"
>
  <a href="javascript:">+</a>
</div>

<div id="ui-stack"></div>

<!-- Tile images -->
<div style="display: none">
  <img id="illustrated_materials" src="/static/tabletop/assets/painted-stone.png" alt="" />
  <img id="illustrated_wilds" src="/static/tabletop/assets/painted-wilds-v1.png" alt="" />
  <img id="illustrated_woodland" src="/static/tabletop/assets/woodland-sprites-v1.png" alt="" />
  <img id="floor" src="/gamedata/{{ version }}/floor.png" />
  <img id="wall" src="/gamedata/{{ version }}/wall.png" />
  <img id="feat" src="/gamedata/{{ version }}/feat.png" />
  <img id="main" src="/gamedata/{{ version }}/main.png" />
  <img id="player" src="/gamedata/{{ version }}/player.png" />
  <img id="icons" src="/gamedata/{{ version }}/icons.png" />
  <img id="gui" src="/gamedata/{{ version }}/gui.png" />
</div>
